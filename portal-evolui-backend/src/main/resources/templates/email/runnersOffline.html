<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title th:text="${dto.title}">Title</title>
    <style>
        @font-face {
            font-family: 'Poppins';
            font-style: normal;
            font-weight: 400;
            src: url('https://fonts.gstatic.com/s/poppins/v20/pxiEyp8kv8JHgFVrJJfedw.woff2') format('woff2');
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }

        p, h1, h2, h3, h4, h5, span, small {
            font-family: 'Poppins', sans-serif;
        }

        small {
            color: #222 !important;
        }

        h2 {
            font-weight: 600;
            font-size: 20px;
        }

        h3 {
            font-weight: 500;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0;
        }

        .header {
            width: 100%;
        }

        .info-box {
            background-color: #f1eee9;
            padding: 20px;
            margin: -5px 0 20px 0;
            text-align: center;
        }

        .info-box h2 {
            color: #333333;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .info-box p {
            margin: 5px 0;
            font-size: 14px;
            color: #333333;
        }

        .runners-table {
            margin: 0 20px 20px 20px;
            width: calc(100% - 40px);
        }

        .runners-table th {
            background-color: #383838;
            color: white;
            text-align: left;
            padding: 8px 10px;
            font-size: 13px;
        }

        .runners-table td {
            padding: 8px 10px;
            font-size: 13px;
            border-bottom: 1px solid #f1eee9;
            color: #333333;
        }

        span.status-offline {
            font-style: italic;
            font-weight: bold;
            text-transform: uppercase;
            color: #d90000;
        }

        .footer {
            background-color: #383838;
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <img src="https://www.evoluitecnologia.com.br/email/img/br-header.jpg" alt="Runners offline" class="header"/>

    <div class="info-box">
        <h2 th:text="${dto.title}">title</h2>
        <p><strong>VERIFICADO EM:</strong> <span th:text="${dto.checkedAt}">checkedAt</span></p>
    </div>

    <table class="runners-table">
        <thead>
        <tr>
            <th>Runner</th>
            <th>SO</th>
            <th>Status</th>
            <th>Labels</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="runner : ${dto.runners}">
            <td th:text="${runner.name}">nome</td>
            <td th:text="${runner.os}">os</td>
            <td><span class="status-offline" th:text="${runner.status}">offline</span></td>
            <td th:text="${runner.labels}">labels</td>
        </tr>
        </tbody>
    </table>

    <div class="footer">
        EVOLUI TECNOLOGIA
    </div>
</div>
</body>
</html>
